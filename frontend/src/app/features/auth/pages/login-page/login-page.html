<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h1>Iniciar sesión</h1>

  <div class="field">
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" formControlName="usuario" autocomplete="username" />
    @if (form.controls.usuario.invalid && form.controls.usuario.touched) {
      <p class="error" role="alert">El usuario es obligatorio.</p>
    }
  </div>

  <div class="field">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="error" role="alert">La contraseña es obligatoria.</p>
    }
  </div>

  @if (loginFallido) {
    <p class="error" role="alert">Usuario y contraseña son obligatorios.</p>
  }

  <button type="submit">Entrar</button>
</form>
